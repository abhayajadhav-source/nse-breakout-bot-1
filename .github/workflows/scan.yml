name: NSE 100 Breakout Scan (every 15 min, market hours)

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is in UTC. NSE = IST (UTC+5:30).
    # Market hours 09:15-15:30 IST  ==  03:45-10:00 UTC.
    - cron: "45 3 * * 1-5"
    - cron: "0,15,30,45 4 * * 1-5"
    - cron: "0,15,30,45 5 * * 1-5"
    - cron: "0,15,30,45 6 * * 1-5"
    - cron: "0,15,30,45 7 * * 1-5"
    - cron: "0,15,30,45 8 * * 1-5"
    - cron: "0,15,30,45 9 * * 1-5"
    - cron: "0 10 * * 1-5"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          GMAIL_USER:         ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO:           ${{ secrets.EMAIL_TO }}
          PROXIMITY:          "0.0"
          MOCK_RUN:           "false"
        run: python scanner.py
